# Theme
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"   # fx "dark", "air", "contrast", "mint" osv.

# Site settings
title: "Mit portfolie"
description: "Kort beskrivelse af mig"
locale: "da-DK"
email:
github_username: MarieDrachmann
search: true

# Adresse til siden
url: "https://mariedrachmann.github.io/"

# Build settings
markdown: kramdown
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Europe/Copenhagen

# Gør at Jekyll også bruger siderne i mappen _pages
include:
  - _pages

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-gist
  - jemoji

author:
  name   : "Marie Drachmann"
  avatar : "/assets/images/profil.jpg"
  bio    : "My name is Marie Drachmann, i am a 29 year old woman with interests in learning, development of learning platforms and tools for learning, and gamifying learning. In my freetime I volunteer for High5Girls as a rolemodel, help plan events for SpilTek event committee on SDU and have several creative hobbies as crocheting, sewing, upcycling, perler and the likes."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/MarieDrachmann"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/marie-drachmann-434088331/"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/DITBRUGERNAVN"

defaults:
  # Indlæg (_posts)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  # Sider (_pages og forsiden)
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
